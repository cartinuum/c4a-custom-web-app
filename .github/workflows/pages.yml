name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Exposes Actions **repository** vars and vars on Environment `github-pages` to `vars.*` below.
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Project Pages: /<repository-name>/ ; user/org Pages repo: set repo var VITE_BASE_PATH=/ or override here.
      # `vars.*` = Settings → Secrets and variables → Actions → Variables (repository/org)
      # and variables on Environment `github-pages`. They must be forwarded into `env` for Vite to see them.
      - name: Build
        env:
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || format('/{0}/', github.event.repository.name) }}
          VITE_ARCGIS_PORTAL: ${{ vars.VITE_ARCGIS_PORTAL }}
          VITE_WEBMAP_ITEM_ID: ${{ vars.VITE_WEBMAP_ITEM_ID }}
          VITE_CONNECT_BASE: ${{ vars.VITE_CONNECT_BASE }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
